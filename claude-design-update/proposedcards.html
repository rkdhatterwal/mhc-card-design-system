<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHC Proposed Product Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { poppins: ['Poppins', 'system-ui', 'sans-serif'] },
        colors: {
          mhcink: '#393839',
          mhcstroke: '#807E7F',
          mhcmuted: '#9CA3AF',
          mhcputty: '#F0EAE4',
          mhcbeige: '#F9F8F4',
          mhctile: '#F7F6F1',
          mhcaccent: '#e3e829',
          mhcsleep: '#DCEDEC',
          mhcenergy: '#F7F7DD',
          mhcbalance: '#F0EAE4',
          mhcsub: '#6B6A6B',
          mhcform: '#6B7280',
        },
        borderRadius: { ctl: '9px', img: '13px', card: '14px' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Poppins', system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-[#f4f4f5] min-h-screen">

  <div class="max-w-[1400px] mx-auto px-6 py-10">
    <h1 class="text-2xl font-bold text-mhcink mb-1">Proposed product cards</h1>
    <p class="text-sm text-[#6b7280] mb-8 max-w-2xl">Pixel build of the "Proposed" cards from the redesign comparison — photos are placeholders, everything else follows the settled card spec.</p>

    <h2 class="text-xs font-bold tracking-[1.2px] uppercase text-mhcink mb-3">Grid</h2>
    <div id="grid" class="grid gap-5 grid-cols-[repeat(auto-fit,minmax(380px,1fr))] mb-14"></div>

    <h2 class="text-xs font-bold tracking-[1.2px] uppercase text-mhcink mb-3">Carousel</h2>
    <div id="carousel" class="flex gap-5 overflow-x-auto snap-x snap-mandatory no-scrollbar pb-4"></div>
  </div>

<script>
// ---- Icons (solid MHC glyph set, paths copied from Redesign Comparison.dc.html mhcIcon()) ----
const ICONS = {
  indica: '<path d="M11.6 4.1 A5 5 0 1 0 11.6 11.9 A3.6 3.6 0 1 1 11.6 4.1 Z" fill="currentColor" stroke="none"/>',
  sativa: '<path d="M9.6 1.4 3.3 9.2h3.5l-.7 5.4 6.6-8.1H9.1z" fill="currentColor" stroke="none"/>',
  hybrid: '<path d="M0.8 13.2 A7.2 7.2 0 0 1 15.2 13.2 L12.7 13.2 A4.7 4.7 0 0 0 3.3 13.2 Z" fill="currentColor" stroke="none"/><path d="M4.6 13.2 A3.4 3.4 0 0 1 11.4 13.2 L9 13.2 A1 1 0 0 0 7 13.2 Z" fill="currentColor" stroke="none"/>',
};
const STRAIN = {
  indica: { word: 'Sleep', name: 'Indica', bg: '#DCEDEC' },
  sativa: { word: 'Energy', name: 'Sativa', bg: '#F7F7DD' },
  hybrid: { word: 'Balance', name: 'Hybrid', bg: '#F0EAE4' },
};
const EFFECT_ORDER = ['indica', 'hybrid', 'sativa'];

function icon(kind, size) {
  size = size || 14;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" class="block">' + ICONS[kind] + '</svg>';
}

// ---- Product data (from DATA in Redesign Comparison.dc.html) ----
const CARDS = [
  {
    id: 1, badge: 'B2G1', img: 'uploads/001-MHC-Rosin-Gummies-30ct-mixed_berry--web.png',
    title: 'Enhanced Spectrum', sub: 'THC Craft Soda — Grape Kush',
    strains: ['indica', 'hybrid', 'sativa'], sizes: ['1ct', '5ct', '20ct'],
    options: [
      { strain: 'indica', flavor: 'Huckleberry', count: '1ct', price: '$5' },
      { strain: 'indica', flavor: 'Huckleberry', count: '5ct', price: '$10' },
      { strain: 'indica', flavor: 'Huckleberry', count: '20ct', price: '$50' },
      { strain: 'hybrid', flavor: 'Passionfruit', count: '1ct', price: '$5' },
      { strain: 'hybrid', flavor: 'Passionfruit', count: '5ct', price: '$10' },
      { strain: 'hybrid', flavor: 'Passionfruit', count: '20ct', price: '$50' },
      { strain: 'sativa', flavor: 'Strawberry Rhubarb', count: '1ct', price: '$5' },
      { strain: 'sativa', flavor: 'Strawberry Rhubarb', count: '5ct', price: '$25' },
      { strain: 'sativa', flavor: 'Strawberry Rhubarb', count: '20ct', price: '$50' },
    ],
    ratingAvg: '4.5', ratingCount: '(2)',
  },
  {
    id: 2, badge: 'SALE', img: 'uploads/003-MHC-Carts-Live-Rosin-Pouch-RENDER-Front_Headband_High%20Res.png',
    title: 'Sleepy Time', sub: 'Indica Gummies',
    strains: ['indica'], sizes: ['10ct', '30ct'],
    options: [
      { strain: 'indica', flavor: '10ct', count: '', price: '$18' },
      { strain: 'indica', flavor: '30ct', count: '', price: '$42' },
    ],
    ratingAvg: '5.0', ratingCount: '(41)',
  },
  {
    id: 3, badge: '', img: 'uploads/001-MHC-Gummies-Rosin-3ct-peaches_cream-web.png',
    title: 'CBD Tincture 1000mg', sub: '',
    strains: [], sizes: ['15ml', '30ml'],
    options: [
      { strain: '', flavor: '15ml', count: '', price: '$34' },
      { strain: '', flavor: '30ml', count: '', price: '$59', soldOut: true },
    ],
    ratingAvg: '', ratingCount: '',
  },
  {
    id: 4, badge: 'New!', img: 'uploads/Caramel-Render_SamplePouch-hybrid-web.png',
    title: 'Hybrid Soda', sub: 'Single Size',
    strains: ['hybrid'], sizes: ['1ct'],
    options: [
      { strain: 'hybrid', flavor: '1ct', count: '', price: '$6' },
    ],
    ratingAvg: '4.0', ratingCount: '(8)',
  },
];

function renderOption(c, o, i) {
  const prevStrain = i > 0 ? c.options[i - 1].strain : null;
  const showGroup = o.strain && o.strain !== prevStrain;
  const group = showGroup
    ? '<li class="' + (i === 0 ? '' : 'border-t border-mhcstroke/40 mt-1.5 pt-1.5') + ' px-3 py-1.5 text-[11px] font-bold tracking-[.6px] text-mhcink bg-mhctile">' + STRAIN[o.strain].word + ' (' + STRAIN[o.strain].name + ')</li>'
    : '';
  return group + '<li data-option data-strain="' + o.strain + '" data-flavor="' + o.flavor + '" data-count="' + o.count + '" data-price="' + o.price + '" data-sold="' + !!o.soldOut + '" ' +
    'class="flex items-center gap-2 mx-1 mb-1 px-2 py-2 rounded-md cursor-pointer text-[13px] hover:bg-[#F2F4C4] ' + (i === 0 ? 'bg-mhcaccent' : '') + ' ' + (o.soldOut ? 'opacity-50' : '') + '">' +
    (o.strain ? '<span class="flex items-center justify-center w-6 h-6 rounded-ctl shrink-0 text-mhcink" style="background:' + STRAIN[o.strain].bg + '">' + icon(o.strain, 13) + '</span>' : '') +
    '<span class="flex-1 min-w-0 font-semibold truncate ' + (o.soldOut ? 'line-through' : '') + '">' + o.flavor + (o.soldOut ? ' — Sold out' : '') + '</span>' +
    (o.count ? '<span class="shrink-0 text-[12px] text-[#4A4A49]">' + o.count + '</span>' : '') +
    '<span class="shrink-0 font-normal text-[#4A4A49]">' + o.price + '</span>' +
    '</li>';
}

function renderCard(c) {
  const first = c.options[0];
  const ordered = EFFECT_ORDER.filter((k) => c.strains.includes(k));

  const effectsRow = ordered.length
    ? '<div class="flex items-center gap-2">' + ordered.map((k) => '<span title="' + STRAIN[k].word + '" class="text-mhcmuted">' + icon(k, 15) + '</span>').join('') + '</div>'
    : '';
  const sizesRow = c.sizes.length
    ? '<div class="text-[11px] font-medium tracking-[.3px] text-mhcmuted">' + c.sizes.join('&nbsp;&nbsp;·&nbsp;&nbsp;') + '</div>'
    : '';

  return (
    '<div data-card class="relative flex flex-row bg-white border border-mhcstroke rounded-card overflow-hidden h-[404px] w-full">' +

      // photo column
      '<a href="#" class="relative block shrink-0 basis-[34%] self-stretch rounded-img rounded-r-none overflow-hidden bg-mhcbeige">' +
        '<img src="' + c.img + '" alt="' + c.title + '" class="absolute inset-0 w-full h-full object-cover">' +
        '<span class="absolute top-[11px] left-[11px] z-10 text-[12px] font-bold uppercase tracking-[.3px] text-mhcink">Max</span>' +
        (c.badge ? '<span class="absolute top-[38px] left-[11px] z-10 bg-white text-mhcink font-bold text-[12px] leading-none tracking-[.2px] px-[10px] py-[5px] rounded-ctl border border-mhcstroke whitespace-nowrap">' + c.badge + '</span>' : '') +
      '</a>' +

      // content column
      '<div class="flex flex-col flex-1 min-w-0 p-[11px] gap-2">' +
        '<p class="m-0 text-[15px] font-normal uppercase tracking-[.2px] text-mhcsub leading-[1.12] truncate">Modern Herb Co</p>' +
        '<a href="#" class="block text-[20px] font-bold text-mhcink leading-[1.12] uppercase truncate">' + c.title + '</a>' +
        (c.sub ? '<p class="m-0 text-[15px] font-normal uppercase text-mhcform leading-[1.12] truncate">' + c.sub + '</p>' : '') +

        '<div class="flex-1 min-h-2"></div>' +

        (effectsRow || sizesRow ? '<div class="flex flex-col gap-2">' + effectsRow + sizesRow + '</div>' : '') +

        // variant dropdown
        '<div class="relative" data-dropdown>' +
          '<button type="button" data-dropdown-trigger class="relative w-full flex items-center gap-1.5 font-poppins text-[13px] font-semibold text-mhcink bg-white border-[1.5px] border-mhcstroke rounded-ctl pl-2.5 pr-8 py-2 text-left">' +
            (first.strain ? '<span class="flex items-center justify-center w-6 h-6 rounded-ctl shrink-0 text-mhcink" style="background:' + STRAIN[first.strain].bg + '">' + icon(first.strain, 13) + '</span>' : '') +
            '<span data-sel-flavor class="flex-1 min-w-0 truncate">' + first.flavor + '</span>' +
            (first.count ? '<span data-sel-count class="shrink-0 text-[12px] text-mhcmuted">' + first.count + '</span>' : '<span data-sel-count class="shrink-0 text-[12px] text-mhcmuted"></span>') +
            '<span data-sel-price class="font-normal text-[#4A4A49] shrink-0">' + first.price + '</span>' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-[#6b7280]"><polyline points="6 9 12 15 18 9"/></svg>' +
          '</button>' +
          '<ul data-dropdown-menu class="hidden list-none m-0 p-1 absolute top-full left-0 right-0 mt-1 z-20 bg-white border-[1.5px] border-mhcstroke rounded-ctl shadow-[0_8px_28px_rgba(0,0,0,.18)] max-h-[184px] overflow-y-auto">' +
            c.options.map((o, i) => renderOption(c, o, i)).join('') +
          '</ul>' +
        '</div>' +

        // subscribe / one-time
        '<div role="radiogroup" data-radio-group class="flex flex-col gap-1.5">' +
          '<div data-radio="once" role="radio" aria-checked="true" class="flex items-center gap-2 cursor-pointer bg-white border-[1.5px] border-mhcstroke rounded-ctl px-[11px] py-[9px]">' +
            '<span class="flex items-center justify-center w-[15px] h-[15px] rounded-full border-[1.5px] border-mhcstroke bg-white shrink-0"><span data-dot class="block w-[7px] h-[7px] rounded-full bg-mhcink"></span></span>' +
            '<span class="flex-1 min-w-0 text-[12px] font-semibold text-mhcink leading-[1.25]">One-time purchase</span>' +
            '<span class="shrink-0 text-[12px] font-normal text-[#4A4A49]" data-once-price>' + first.price + '</span>' +
          '</div>' +
          '<div data-radio="sub" role="radio" aria-checked="false" class="flex flex-col gap-1 cursor-pointer bg-white border-[1.5px] border-[#e5e7eb] rounded-ctl px-[11px] py-[9px]">' +
            '<span class="flex items-center gap-2">' +
              '<span class="flex items-center justify-center w-[15px] h-[15px] rounded-full border-[1.5px] border-mhcstroke bg-white shrink-0"><span data-dot class="block w-[7px] h-[7px] rounded-full bg-transparent"></span></span>' +
              '<span class="flex-1 min-w-0 text-[12px] font-semibold text-mhcink leading-[1.25]">Subscribe &amp; Save</span>' +
              '<span class="shrink-0 text-[12px] font-normal text-[#4A4A49]" data-sub-price>$' + (Math.round(parseFloat(first.price.replace(/[^0-9.]/g, '')) * 0.7 * 100) / 100).toFixed(2) + '</span>' +
            '</span>' +
            '<span class="pl-[23px] text-[11px] font-normal text-[#4A4A49] leading-[1.3]">Save 30% on your first order, then 10% on every order after.</span>' +
          '</div>' +
        '</div>' +

        // buy row
        '<div class="flex items-stretch gap-1.5">' +
          '<a href="#" class="flex-none basis-[34%] flex items-center justify-center border-[1.5px] border-mhcstroke bg-mhcink text-white text-[13px] font-bold rounded-ctl px-2 py-2">Details</a>' +
          '<button type="button" data-add-btn data-sold="' + !!first.soldOut + '" class="flex-1 flex items-center justify-center gap-1.5 border-[1.5px] border-mhcstroke rounded-ctl px-2 py-2 font-poppins text-[13px] font-bold ' + (first.soldOut ? 'bg-[#e5e7eb] text-mhcmuted border-[#d1d5db] cursor-not-allowed' : 'bg-mhcaccent text-mhcink cursor-pointer') + '">' +
            (first.soldOut
              ? '<span>Sold Out</span>'
              : '<svg width="20" height="20" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block"><circle cx="9" cy="23" r="1.4"/><circle cx="19" cy="23" r="1.4"/><path d="M2 4h3l2.4 12.1a1.8 1.8 0 0 0 1.8 1.4h8.7a1.8 1.8 0 0 0 1.8-1.4l1.1-5.6"/><line x1="17" y1="2" x2="17" y2="9"/><line x1="13.5" y1="5.5" x2="20.5" y2="5.5"/></svg>') +
          '</button>' +
        '</div>' +

        // price / rating row
        '<div class="flex items-center justify-end gap-1.5 flex-wrap">' +
          '<span class="text-[12px] font-normal text-mhcink bg-mhcbeige rounded-ctl px-[11px] py-[5px] leading-[1.2] whitespace-nowrap">Fast Shipping</span>' +
          '<p data-price-display class="m-0 text-[15px] font-bold leading-[1.2] ' + (first.soldOut ? 'text-mhcmuted' : 'text-mhcink') + '">' + (first.soldOut ? 'Sold out' : first.price) + '</p>' +
          (c.ratingAvg ? '<span class="inline-flex items-center gap-[3px] text-[13px] font-semibold text-mhcink whitespace-nowrap">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="#e3e829" stroke="#807E7F" stroke-width="1.4" stroke-linejoin="round" class="block shrink-0"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.42L18 20.5 12 17l-6 3.5 1.25-6.81L2.5 9.27l6.6-1.01z"/></svg>' +
            '<span>' + c.ratingAvg + '</span><span class="text-[#4A4A49] font-normal">' + c.ratingCount + '</span>' +
          '</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

const gridEl = document.getElementById('grid');
const carouselEl = document.getElementById('carousel');
CARDS.forEach((c) => {
  gridEl.insertAdjacentHTML('beforeend', renderCard(c));
  carouselEl.insertAdjacentHTML('beforeend', '<div class="shrink-0 snap-start w-[420px]">' + renderCard(c) + '</div>');
});

// ---- interactivity ----
document.addEventListener('click', (e) => {
  const trigger = e.target.closest('[data-dropdown-trigger]');
  if (trigger) {
    const menu = trigger.closest('[data-dropdown]').querySelector('[data-dropdown-menu]');
    const willOpen = menu.classList.contains('hidden');
    document.querySelectorAll('[data-dropdown-menu]').forEach((m) => m.classList.add('hidden'));
    if (willOpen) menu.classList.remove('hidden');
    return;
  }

  const option = e.target.closest('[data-option]');
  if (option) {
    const dropdown = option.closest('[data-dropdown]');
    const card = option.closest('[data-card]');
    const menu = dropdown.querySelector('[data-dropdown-menu]');
    const t = dropdown.querySelector('[data-dropdown-trigger]');
    const price = option.dataset.price;
    const sold = option.dataset.sold === 'true';

    t.querySelector('[data-sel-flavor]').textContent = option.dataset.flavor;
    t.querySelector('[data-sel-count]').textContent = option.dataset.count || '';
    t.querySelector('[data-sel-price]').textContent = price;
    menu.querySelectorAll('[data-option]').forEach((o) => o.classList.remove('bg-mhcaccent'));
    option.classList.add('bg-mhcaccent');
    menu.classList.add('hidden');

    const priceEl = card.querySelector('[data-price-display]');
    priceEl.textContent = sold ? 'Sold out' : price;
    priceEl.classList.toggle('text-mhcmuted', sold);
    priceEl.classList.toggle('text-mhcink', !sold);

    card.querySelector('[data-once-price]').textContent = price;
    const subPrice = sold ? '' : ('$' + (Math.round(parseFloat(price.replace(/[^0-9.]/g, '')) * 0.7 * 100) / 100).toFixed(2));
    card.querySelector('[data-sub-price]').textContent = subPrice;

    const addBtn = card.querySelector('[data-add-btn]');
    addBtn.dataset.sold = sold;
    addBtn.innerHTML = sold
      ? '<span>Sold Out</span>'
      : '<svg width="20" height="20" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block"><circle cx="9" cy="23" r="1.4"/><circle cx="19" cy="23" r="1.4"/><path d="M2 4h3l2.4 12.1a1.8 1.8 0 0 0 1.8 1.4h8.7a1.8 1.8 0 0 0 1.8-1.4l1.1-5.6"/><line x1="17" y1="2" x2="17" y2="9"/><line x1="13.5" y1="5.5" x2="20.5" y2="5.5"/></svg>';
    addBtn.classList.toggle('bg-mhcaccent', !sold);
    addBtn.classList.toggle('text-mhcink', !sold);
    addBtn.classList.toggle('cursor-pointer', !sold);
    addBtn.classList.toggle('bg-[#e5e7eb]', sold);
    addBtn.classList.toggle('text-mhcmuted', sold);
    addBtn.classList.toggle('border-[#d1d5db]', sold);
    addBtn.classList.toggle('cursor-not-allowed', sold);
    return;
  }

  const radio = e.target.closest('[data-radio]');
  if (radio) {
    const group = radio.closest('[data-radio-group]');
    group.querySelectorAll('[data-radio]').forEach((r) => {
      const active = r === radio;
      r.setAttribute('aria-checked', String(active));
      r.querySelector('[data-dot]').classList.toggle('bg-mhcink', active);
      r.querySelector('[data-dot]').classList.toggle('bg-transparent', !active);
      if (r.dataset.radio === 'sub') {
        r.classList.toggle('bg-mhctile', active);
        r.classList.toggle('bg-white', !active);
      }
    });
    return;
  }

  if (!e.target.closest('[data-dropdown]')) {
    document.querySelectorAll('[data-dropdown-menu]').forEach((m) => m.classList.add('hidden'));
  }
});
</script>
</body>
</html>
